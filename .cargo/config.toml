# Build output lives on the data disk: the system disk has about 30 GB free.
[build]
target-dir = "/mnt/toshiba/alexandrie/hoh/target"

# CEO 19.11 08:45: the USB data disk is the bottleneck — line tables only (panics keep file:line), no incremental cache.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
