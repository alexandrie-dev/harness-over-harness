description = "Window-engine host for an OpenAI-compatible HoH model and its credential"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util.workspace = true
hoh-credentials = { path = "../hoh-credentials" }
hoh-error = { path = "../hoh-error" }
hoh-kernel = { path = "../hoh-kernel" }
hoh-llm = { path = "../hoh-llm" }
hoh-llm-openai = { path = "../hoh-llm-openai" }
hoh-protocol = { path = "../hoh-protocol" }
hoh-sdk-jsonrpc-server = { path = "../hoh-sdk-jsonrpc-server" }
hoh-timeout = { path = "../hoh-timeout" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "test-util"] }
