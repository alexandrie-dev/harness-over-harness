[package]
name = "hoh-window-destructive-guard"
description = "HoH window profile: asks the user before a bash command that may delete or overwrite files (no dsh counterpart)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hoh-destructive-classifier = { path = "../hoh-destructive-classifier" }
hoh-error = { path = "../hoh-error" }
hoh-kernel = { path = "../hoh-kernel" }
hoh-tools = { path = "../hoh-tools" }
hoh-user-approval = { path = "../hoh-user-approval" }
hoh-working-directory = { path = "../hoh-working-directory" }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros"] }
hoh-protocol = { path = "../hoh-protocol" }
tempfile.workspace = true
