[package]
name = "hoh-harness-claude"
description = "HoH: Claude Code (the installed `claude` CLI, stream-json control protocol) as an external harness (HOH-18)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hoh-error = { path = "../hoh-error" }
hoh-external-harness = { path = "../hoh-external-harness" }
hoh-kernel = { path = "../hoh-kernel" }
hoh-util-values = { path = "../hoh-util-values" }
futures-util.workspace = true
getrandom.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
hoh-destructive-classifier = { path = "../hoh-destructive-classifier" }
# The slot's kernel for `tests/slot.rs`: Claude mounted as a plugin and reached as the slot does.
hoh-agent = { path = "../hoh-agent" }
hoh-session = { path = "../hoh-session" }
hoh-session-projection = { path = "../hoh-session-projection" }
hoh-user-approval = { path = "../hoh-user-approval" }
hoh-user-questions = { path = "../hoh-user-questions" }
# The window of the slot behind the SDK server, for `effective.flags` in `tests/slot.rs`.
hoh-llm = { path = "../hoh-llm" }
hoh-loader = { path = "../hoh-loader" }
hoh-sdk-jsonrpc-server = { path = "../hoh-sdk-jsonrpc-server" }
hoh-timeout = { path = "../hoh-timeout" }
# Turns the `stub` feature on for the tests only, so the stub binary is not part of a normal build.
hoh-harness-claude = { path = ".", features = ["stub"] }

[features]
stub = []

# The stub of the Claude CLI used by the tests (tests/stub/): speaks the stream-json control
# protocol from canned scenarios. The real `claude` is never run by the tests.
[[bin]]
name = "claude-stub"
path = "tests/stub/claude.rs"
required-features = ["stub"]
test = false
doc = false
