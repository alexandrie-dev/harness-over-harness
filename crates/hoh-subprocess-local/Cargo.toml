[package]
name = "hoh-subprocess-local"
description = "Port of @deepseek-ai/dsh-subprocess-local (packages/subprocess/subprocess-local)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hoh-kernel = { path = "../hoh-kernel" }
hoh-subprocess = { path = "../hoh-subprocess" }
hoh-timeout = { path = "../hoh-timeout" }
hoh-error = { path = "../hoh-error" }
hoh-util-values = { path = "../hoh-util-values" }
hoh-util-workspace-path = { path = "../hoh-util-workspace-path" }
portable-pty.workspace = true
rustix = { workspace = true, features = ["process", "fs", "stdio", "system", "termios"] }
futures-util.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tempfile.workspace = true
getrandom.workspace = true
nix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "hoh-subprocess-runner"
path = "src/bin.rs"
