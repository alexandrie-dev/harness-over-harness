hoh-sandbox = { path = "../hoh-sandbox" }
hoh-session = { path = "../hoh-session" }
hoh-session-projection = { path = "../hoh-session-projection" }
hoh-shell = { path = "../hoh-shell" }
hoh-user-approval = { path = "../hoh-user-approval" }
hoh-util-values = { path = "../hoh-util-values" }
indexmap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
