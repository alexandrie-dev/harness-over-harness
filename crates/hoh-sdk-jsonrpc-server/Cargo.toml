[package]
name = "hoh-sdk-jsonrpc-server"
description = "Port of @deepseek-ai/dsh-sdk-jsonrpc-server (packages/sdk/server)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
