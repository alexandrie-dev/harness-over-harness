[package]
name = "hoh-tool-subagent"
description = "Model-facing subagent delegation tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hoh-agent = { path = "../hoh-agent" }
hoh-agent-preset-registry = { path = "../hoh-agent-preset-registry" }
hoh-brand = { path = "../hoh-brand" }
hoh-error = { path = "../hoh-error" }
hoh-kernel = { path = "../hoh-kernel" }
hoh-llm = { path = "../hoh-llm" }
hoh-scope = { path = "../hoh-scope" }
hoh-session = { path = "../hoh-session" }
hoh-session-projection = { path = "../hoh-session-projection" }
hoh-subagent = { path = "../hoh-subagent" }
hoh-system-prompt = { path = "../hoh-system-prompt" }
hoh-timeout = { path = "../hoh-timeout" }
hoh-tools = { path = "../hoh-tools" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
hoh-agent-loop-testkit = { path = "../hoh-agent-loop-testkit" }
hoh-fs-local = { path = "../hoh-fs-local" }
hoh-tool-executor-native = { path = "../hoh-tool-executor-native" }
hoh-tool-testkit = { path = "../hoh-tool-testkit" }
hoh-working-directory = { path = "../hoh-working-directory" }
tokio = { workspace = true, features = ["test-util"] }

