[package]
name = "hoh-harness-codex"
description = "HoH: Codex app-server as an external harness (HOH-18)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hoh-error = { path = "../hoh-error" }
hoh-external-harness = { path = "../hoh-external-harness" }
hoh-kernel = { path = "../hoh-kernel" }
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
hoh-harness-codex = { path = ".", features = ["stub"] }

[features]
stub = []

[[bin]]
name = "codex-stub"
path = "tests/stub/codex.rs"
required-features = ["stub"]
test = false
doc = false
