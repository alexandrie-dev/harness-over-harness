[package]
name = "hoh-llm"
description = "Port of @deepseek-ai/dsh-llm (packages/llm/llm)"
version = "0.2.2-rc.3"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hoh-attachment = { path = "../hoh-attachment" }
hoh-brand = { path = "../hoh-brand" }
hoh-error = { path = "../hoh-error" }
hoh-kernel = { path = "../hoh-kernel" }
hoh-package-manifest = { path = "../hoh-package-manifest" }
hoh-timeout = { path = "../hoh-timeout" }
hoh-util-crypto = { path = "../hoh-util-crypto" }
hoh-util-values = { path = "../hoh-util-values" }
futures-util.workspace = true
indexmap.workspace = true
regex.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
