<!doctype html>
<!-- Вход окна HoH на веб-клиенте T3 (HOH-40): apps/web/index.html T3 Code (MIT, коммит 803f21f6). Отличия: имя и значок —
     HoH; встроенные сценарий темы и стили вынесены в файлы (CSP окна); до темы — умолчания HoH (hoh-defaults.js: тёмная, панель 208 px); без manifest/apple-touch-icon и desktopBridge;
     запуск — src/t3-entry/main.ts (хост HoH, затем их bootstrap.ts). Сборка: vite build --mode t3 → dist/index.html. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/src/assets/emblem-fav-2x.png" sizes="64x68" />
    <script src="/hoh-defaults.js"></script>
    <script src="/boot-theme.js"></script>
    <link rel="stylesheet" href="/src/t3-entry/boot.css" />
    <title>HoH</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="HoH splash screen">
          <img id="boot-shell-logo" src="/src/assets/emblem-splash-1x.png"
            srcset="/src/assets/emblem-splash-1x.png 1x, /src/assets/emblem-splash-15x.png 1.5x, /src/assets/emblem-splash-2x.png 2x, /src/assets/emblem-splash-3x.png 3x"
            width="200" height="216" alt="HoH" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/t3-entry/main.ts"></script>
  </body>
</html>
