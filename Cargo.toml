[workspace]
resolver = "3"
# `apps/*` joins the members with the first application, `ui` with the desktop window (PLAN.md).
# Cargo rejects a glob that matches nothing.
members = ["crates/*", "plugins/*", "apps/hoh"]
# The desktop shell (Tauri) is its own workspace with its own lock file, so its dependency tree stays out of the engine.
exclude = ["apps/hoh-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

# The only place where third-party crates and their versions are named.
# A crate may be added here only together with a line in docs/porting/DEPS.md.
[workspace.dependencies]
base64 = "0.23.1"
quick-xml = "0.41.0" # XML responses in hoh-web-search-yandex; cached, no external entity resolution
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
html5ever = "0.40.1" # hoh-tool-web: порт turndown (DEPS.md §14)
markup5ever_rcdom = "0.40.1+unofficial" # hoh-tool-web
rusqlite = { version = "0.43.0", features = ["bundled"] } # hoh-storage-sqlite, hoh-session-query-sqlite (DEPS.md решение 9)
getrandom = "0.4.3"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = "1.0.0"
kamadak-exif = "0.6.2"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
async-compression = { version = "0.4.42", features = ["tokio", "gzip", "deflate", "brotli", "zstd"] }  # Content-Encoding in hoh-web-fetch-http (undici decodes, keeps headers)
encoding_rs = "0.8.44"  # WHATWG labels for TextDecoder (DEPS.md)
notify = "8.2.2"  # fs watching (DEPS.md decision 6), hoh-fs-local
feruca = "0.13.0"  # UCA/CLDR root collation for String.localeCompare in hoh-fs-local (DEPS.md 5.6)
nix = { version = "0.28.0", default-features = false }  # safe close(2) wrapper in hoh-fs-local (DEPS.md 5.6); already in Cargo.lock via portable-pty
portable-pty = "0.9.0"  # PTY (DEPS.md decision 10), hoh-subprocess-local
procfs = "0.18.0"  # /proc walk instead of process-inspector.ts (research/v1-shortcuts.md)
zstd = "0.13.5"  # session log frames (DEPS.md decision 8, CEO 18.11: point crates); same version as async-compression uses
rmcp = { version = "=3.10.0", default-features = false, features = ["base64", "client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }  # hoh-mcp-client (DEPS.md: @modelcontextprotocol/client); server/transport-io только в dev-dependencies
landlock = "0.4.7"
moxcms = "0.8.1"
rustix = { version = "1.1.6", features = ["fs", "process"] }
saphyr-parser = "0.3.4"
schemars = { version = "1.2.3", features = ["preserve_order", "indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
syn = { version = "3.0.10", features = ["full"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
trybuild = "1.0.125"
url = "2.5.8"
webp = { version = "0.3.1", default-features = false }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[workspace.lints.rust]
unsafe_code = "deny"
