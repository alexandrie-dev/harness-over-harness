# Services shared by both window profiles over stdio JSON-RPC.
- insert:
    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'

    # The model address and name are open settings; the key lives only in credentials.
    - id: model-host
      name: 'hoh:model-host'

    # Restores and saves the model address and name changed by hoh/settings/set.
    - id: window-model-settings
      name: 'hoh:window-model-settings'

    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')

    # Pictures the person attaches (HOH-41): the window sends their bytes with session/prompt,
    # the store keeps its own copy under the window's data folder, and the Claude executor reads
    # that copy back. Limits as T3's send-turn contract: 10 MiB a picture, 80 MiB of pictures
    # and at most 100 attachments a message; PNG, JPEG, GIF and WebP.
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'
      config:
        maxImageBytes: 10485760
        maxMessageImageBytes: 83886080
        maxImagesPerMessage: 100

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: >-
          Вы помогаете пользователю с задачами по разработке программного обеспечения.
          По умолчанию отвечайте на языке пользователя, если он не попросил выбрать другой язык.

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: workspace-write
        workspaceRoot: !!js process.cwd()
        # Shared by filesystem and bash policy; danger-full-access cannot remove this fence.
        # An overlapping workspace is rejected by the policy before a Session can use it.
        protectedRoots:
          - !!js dshHomePath('')

    - id: filesystem
      name: '@deepseek-ai/dsh-fs-sandbox'

    - id: working-directory
      name: '@deepseek-ai/dsh-working-directory'

    - id: user-questions
      name: '@deepseek-ai/dsh-user-questions'

    - id: user-approval
      name: '@deepseek-ai/dsh-user-approval'

    # Asks the user, through user-approval's host path, before a privileged hoh/* call runs.
    - id: privileged-approver
      name: 'hoh:window-privileged-approver'

    # The external-harness slot: the shared destructive-command classifier, the harness registry
    # with Claude Code in it, and the hoh/executor/* methods the window calls.
    - id: destructive-classifier
      name: 'hoh:destructive-classifier'

    - id: external-harness
      name: 'hoh:external-harness'

    - id: harness-claude
      name: 'hoh:harness-claude'

    - id: harness-codex
      name: 'hoh:harness-codex'

    - id: harness-pi
      name: 'hoh:harness-pi'

    - id: external-harness-window
      name: 'hoh:external-harness-window'

    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: window

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: false
