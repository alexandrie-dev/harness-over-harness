publish.workspace = true

[lints]
workspace = true

[dependencies]
hoh-loader = { path = "../../crates/hoh-loader" }
hoh-kernel = { path = "../../crates/hoh-kernel" }
hoh-commander = { path = "../../crates/hoh-commander" }
hoh-error = { path = "../../crates/hoh-error" }
hoh-util-values = { path = "../../crates/hoh-util-values" }
hoh-home-paths = { path = "../../crates/hoh-home-paths" }
hoh-launch-environment = { path = "../../crates/hoh-launch-environment" }
hoh-http-proxy = { path = "../../crates/hoh-http-proxy" }
hoh-official-bundles = { path = "../../crates/hoh-official-bundles" }
hoh-persona = { path = "../../crates/hoh-persona" }
hoh-llm = { path = "../../crates/hoh-llm" }
hoh-session = { path = "../../crates/hoh-session" }
hoh-session-projection = { path = "../../crates/hoh-session-projection" }
hoh-fs-local = { path = "../../crates/hoh-fs-local" }
hoh-system-prompt = { path = "../../crates/hoh-system-prompt" }
hoh-skill = { path = "../../crates/hoh-skill" }
hoh-storage = { path = "../../crates/hoh-storage" }
