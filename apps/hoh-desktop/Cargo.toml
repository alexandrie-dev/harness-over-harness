[package]
name = "hoh-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Deliberately independent of the engine and its dependency graph.
[workspace]
resolver = "3"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:webkit2gtk", "dep:gtk", "dep:javascriptcore-rs", "dep:soup3", "dep:tauri-build", "dep:tempfile", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
probe = ["desktop"]

[[bin]]
name = "hoh-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "=2.7.4", default-features = false, features = ["config-json"], optional = true }

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "x11", "custom-protocol"], optional = true }
hoh-protocol = { path = "../../crates/hoh-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
libc = "=0.2.191"
semver = { version = "=1.0.28", features = ["serde"] }
sha2 = "=0.11.1"
tempfile = { version = "=3.27.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "=0.23.1"
gtk = { version = "=0.18.2", optional = true }
javascriptcore-rs = { version = "=1.1.2", optional = true }
soup3 = { version = "=0.5.0", optional = true }
webkit2gtk = { version = "=2.0.2", default-features = false, features = ["v2_40"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSOpenPanel", "NSSavePanel", "NSWindow"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSURL"], optional = true }

[profile.dev]
debug = 0
incremental = false
